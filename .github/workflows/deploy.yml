name: Deploy Automático cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  php-quality:
    name: Validar antes do deploy
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_mysql
          coverage: none
      - name: Validar sintaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validar JavaScript
        run: node --check assets/js/app.js
      - name: Executar testes automatizados
        run: php tests/smoke_test.php

  web-deploy:
    name: Atualizar site no cPanel
    needs: php-quality
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Enviar arquivos para o cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/*.md
            config/database.local.php
            storage/installed.lock
            storage/*.log
