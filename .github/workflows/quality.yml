name: Qualidade PHP

on:
  pull_request:
  workflow_dispatch:

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, json, curl, pdo_mysql
          coverage: none
      - name: Instalar dependências (Composer)
        run: composer install --no-dev --optimize-autoloader --prefer-dist
      - name: Validar sintaxe PHP
        run: find . -name '*.php' -not -path './DNB_CRM_v2.jsx - Claude_files/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validar JavaScript das melhorias
        run: |
          node --check assets/crm-enhancements.js
          node --check assets/crm-v36.js
          node --check assets/crm-v36-stabilize.js
          node --check assets/crm-phase2.js
          node --check assets/rd-sync.js
      - name: Testar RBAC
        run: php tests/rbac_test.php
      - name: Testar estrutura da sidebar
        run: php tests/sidebar_structure_test.php
      - name: Testar canvas visual de follow-up
        run: |
          php tests/followup_canvas_test.php
          php tests/followup_flow_pr3_test.php
          php tests/followup_audit_pr3_test.php
      - name: Testar Kanban responsivo de oportunidades
        run: php tests/opportunity_kanban_test.php
      - name: Testar melhorias de permissões e UX do CRM
        run: |
          php tests/crm_enhancements_test.php
          php tests/crm_os_taskboard_v37_test.php
          php tests/os_template_complete_v38_test.php
          php tests/audit_dashboard_report_test.php
          php tests/crm_core_phase1_test.php
          php tests/crm_phase2_ui_test.php
          php tests/rd_station_oauth_test.php
          php tests/rd_station_discovery_phase4_test.php
          php tests/rd_station_sync_phase5_test.php
          php tests/rd_station_phase6_test.php
      - name: Testar CSRF e importação de PDF em Visitas
        run: php tests/visitas_csrf_test.php
      - name: Testar contrato da IA
        run: php tests/ai_payload_test.php
      - name: Testar WhatsApp, RBAC, buffer e Human Lock
        run: |
          php tests/whatsapp_rbac_test.php
          php tests/whatsapp_buffer_test.php
          php tests/whatsapp_human_lock_test.php
          php tests/whatsapp_webhook_test.php
      - name: Testar motor automático de follow-up
        run: |
          php tests/followup_rules_test.php
          php tests/followup_interruption_test.php
          php tests/followup_payload_test.php
          php tests/followup_idempotency_test.php
      - name: Testar múltiplos cargos, pessoas e comissões
        run: |
          php tests/cargos_test.php
          php tests/rbac_multicargo_test.php
          php tests/comissao_cargo_test.php
          php tests/pessoas_sync_test.php
