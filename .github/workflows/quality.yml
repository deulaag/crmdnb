name: Qualidade PHP

on:
  pull_request:
  workflow_dispatch:

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, json, curl, pdo_mysql
          coverage: none
      - name: Validar sintaxe PHP
        run: find . -name '*.php' -not -path './DNB_CRM_v2.jsx - Claude_files/*' -print0 | xargs -0 -n1 php -l
      - name: Testar RBAC
        run: php tests/rbac_test.php
      - name: Testar contrato da IA
        run: php tests/ai_payload_test.php
