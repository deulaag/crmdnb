name: Qualidade PHP

on:
  pull_request:
  workflow_dispatch:

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_mysql
          coverage: none
      - name: Validar sintaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validar JavaScript
        run: node --check assets/js/app.js
      - name: Executar testes
        run: php tests/smoke_test.php
